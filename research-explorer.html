<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Explorer | HSKRC</title><meta name="description" content="Explore HSKRC knowledge nodes, articles, sources, researchers and library records in one research interface."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="hskrc-global.css"><script defer src="hskrc-global.js"></script><style>
:root{--b:#090b0e;--s:#12161b;--g:#c7a15a;--g2:#e2c47f;--t:#f5f2ec;--m:#9ca3ad;--bd:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#c7a15a13,transparent 31%),var(--b);color:var(--t);font:15px/1.65 Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:48px 24px 90px}.hero{padding:38px;border:1px solid #c7a15a45;border-radius:22px;background:linear-gradient(145deg,#c7a15a10,#12161b)}.kick{color:var(--g2);font:800 12px monospace;text-transform:uppercase}.hero h1{font:700 clamp(36px,5vw,58px)/1.08 Georgia;margin:9px 0}.hero p{max-width:820px;color:var(--m);margin:0}.search{margin-top:25px;display:flex;gap:10px}.search input{flex:1;min-width:0;background:#090b0e;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;color:#fff;outline:none}.search input:focus{border-color:#c7a15a88;box-shadow:0 0 0 3px #c7a15a14}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{cursor:pointer;border:1px solid var(--bd);background:#12161b;color:#c8cbd0;padding:8px 12px;border-radius:999px}.tab.active{border-color:#c7a15a77;color:var(--g2);background:#c7a15a10}.meta{display:flex;justify-content:space-between;gap:15px;color:var(--m);font-size:12px;margin:12px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:block;border:1px solid var(--bd);border-radius:15px;padding:19px;background:#12161bf4;min-height:140px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#c7a15a66;background:#17191e}.type{font:800 10px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--g2)}.card h2{font:700 20px/1.25 Georgia;margin:8px 0}.small{color:var(--m);font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--m);border:1px dashed var(--bd);border-radius:15px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{border:1px solid var(--bd);border-radius:11px;padding:10px 14px;min-width:110px}.stat b{display:block;color:var(--g2);font:700 21px Georgia}.stat span{font-size:10px;color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:28px 16px 60px}.hero{padding:25px 20px}.grid{grid-template-columns:1fr}.meta{flex-direction:column}.search{display:block}.search input{width:100%}}
</style></head><body><main><section class="hero"><div class="kick" data-en="HSKRC Research Network" data-fa="شبکه پژوهشی HSKRC">HSKRC Research Network</div><h1 data-en="Research Explorer" data-fa="کاوشگر پژوهش">Research Explorer</h1><p data-en="Search across knowledge nodes, articles, documented sources, researchers and library records from one place." data-fa="گره‌های دانش، مقالات، منابع مستند، پژوهشگران و آثار کتابخانه را از یک مکان جستجو کنید.">Search across knowledge nodes, articles, documented sources, researchers and library records from one place.</p><div class="search"><input id="q" type="search" autocomplete="off" placeholder="Search the research network…" aria-label="Search research network"></div><div id="stats" class="stats"></div></section><div id="tabs" class="tabs"></div><div class="meta"><span id="count">Loading research network…</span><span data-en="Select any result to follow its research connections." data-fa="برای دنبال کردن ارتباطات پژوهشی، یکی از نتایج را انتخاب کنید.">Select any result to follow its research connections.</span></div><div id="results" class="grid"><div class="empty">Loading…</div></div></main><script>
const URL='https://uwuklryzxexpofcxrbnm.supabase.co',KEY='sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2',db=supabase.createClient(URL,KEY);let L=localStorage.getItem('hskrc_language')==='fa'?'fa':'en',all=[],filter='all';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={en:{all:'All',node:'Knowledge',article:'Articles',source:'Sources',researcher:'Researchers',book:'Library',found:n=>`${n} results`,none:'No matching research records.',ph:'Search the research network…'},fa:{all:'همه',node:'دانش',article:'مقالات',source:'منابع',researcher:'پژوهشگران',book:'کتابخانه',found:n=>`${n} نتیجه`,none:'نتیجه پژوهشی مطابق پیدا نشد.',ph:'جستجو در شبکه پژوهشی…'}};
function text(x){return [x.title,x.title_fa,x.name,x.name_fa,x.author,x.field,x.category,x.source_code,x.institution,x.description,x.node_type].filter(Boolean).join(' ').toLowerCase()}function href(x){return x.kind==='node'?`knowledge-node.html?id=${encodeURIComponent(x.id)}`:x.kind==='article'?`article.html?id=${encodeURIComponent(x.id)}`:x.kind==='source'?`source.html?id=${encodeURIComponent(x.id)}`:x.kind==='researcher'?`researcher.html?id=${encodeURIComponent(x.id)}`:`book.html?id=${encodeURIComponent(x.id)}`}function title(x){return E(L==='fa'&&(x.title_fa||x.name_fa)?(x.title_fa||x.name_fa):(x.title||x.name||'Untitled'))}function sub(x){if(x.kind==='node')return x.node_type||'Knowledge Node';if(x.kind==='researcher')return x.field||'Researcher';if(x.kind==='source')return [x.source_code,x.author,x.institution,x.publication_year].filter(Boolean).join(' · ');return [x.author,x.category].filter(Boolean).join(' · ')}
function tabs(){let a=['all','node','article','source','researcher','book'];document.getElementById('tabs').innerHTML=a.map(k=>`<button class="tab ${filter===k?'active':''}" data-k="${k}">${labels[L][k]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.k;tabs();render()})}function render(){let q=document.getElementById('q').value.trim().toLowerCase(),r=all.filter(x=>(filter==='all'||x.kind===filter)&&(!q||text(x).includes(q)));document.getElementById('count').textContent=labels[L].found(r.length);document.getElementById('results').innerHTML=r.length?r.map(x=>`<a class="card" href="${href(x)}"><div class="type">${E(labels[L][x.kind])}</div><h2>${title(x)}</h2><div class="small">${E(sub(x))}</div></a>`).join(''):`<div class="empty">${labels[L].none}</div>`}async function load(){let qs=[db.from('knowledge_nodes').select('id,slug,title,title_fa,node_type,description'),db.from('articles').select('id,title,author,category,published').eq('published',true),db.from('research_sources').select('id,title,author,institution,publication_year,source_code'),db.from('researchers').select('id,slug,name,name_fa,field'),db.from('books').select('id,title,author,category,published')];let rs=await Promise.all(qs),k=['node','article','source','researcher','book'];all=rs.flatMap((r,i)=>(r.data||[]).map(x=>({...x,kind:k[i]})));let counts=Object.fromEntries(k.map(z=>[z,all.filter(x=>x.kind===z).length]));document.getElementById('stats').innerHTML=k.map(z=>`<div class="stat"><b>${counts[z]}</b><span>${labels[L][z]}</span></div>`).join('');tabs();render()}document.getElementById('q').placeholder=labels[L].ph;document.getElementById('q').addEventListener('input',render);load();
</script></body></html>
