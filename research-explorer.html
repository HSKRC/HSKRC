color:var(--m);font-size:12px}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--m);border:1px dashed var(--bd);border-radius:15px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{border:1px solid var(--bd);border-radius:11px;padding:10px 14px;min-width:110px}.stat b{display:block;color:var(--g2);font:700 21px Georgia}.stat span{font-size:10px;color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:28px 16px 60px}.filters{grid-template-columns:1fr}.hero{padding:25px 20px}.grid{grid-template-columns:1fr}.meta{flex-direction:column}.search{display:block}.search input{width:100%}}

</head><body><main><section class="hero"><div class="kick" data-en="HSKRC Research Network" data-fa="شبکه پژوهشی HSKRC">HSKRC Research Network</div><h1 data-en="Research Explorer" data-fa="کاوشگر پژوهش">Research Explorer</h1><p data-en="Search across knowledge nodes, articles, documented sources, researchers and library records from one place." data-fa="گره‌های دانش، مقالات، منابع مستند، پژوهشگران و آثار کتابخانه را از یک مکان جستجو کنید.">Search across knowledge nodes, articles, documented sources, researchers and library records from one place.</p><div class="search"><input aria-label="Search research network" autocomplete="off" id="q" placeholder="Search the research network…" type="search"/></div><div class="stats" id="stats"></div></section><div class="tabs" id="tabs"></div><div class="filters" id="filters"></div><div class="meta"><span id="count">Loading research network…</span><span data-en="Select any result to follow its research connections." data-fa="برای دنبال کردن ارتباطات پژوهشی، یکی از نتایج را انتخاب کنید.">Select any result to follow its research connections.</span></div><div class="grid" id="results"><div class="empty">Loading…</div></div></main><script>
const SUPABASE_URL = "https://uwuklryzxexpofcxrbnm.supabase.co";
const SUPABASE_KEY = "sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);let L=localStorage.getItem('hskrc_language')==='fa'?'fa':'en',all=[],filter='all';const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={en:{all:'All',node:'Knowledge',article:'Articles',source:'Sources',researcher:'Researchers',book:'Library',found:n=>`${n} results`,none:'No matching research records.',ph:'Search title, researcher, topic, source…',language:'Language',date:'Date',topic:'Topic / Category',author:'Researcher / Author',sort:'Sort',any:'Any',newest:'Newest first',oldest:'Oldest first',az:'Title A–Z',za:'Title Z–A',english:'English',persian:'Persian'},fa:{all:'همه',node:'دانش',article:'مقالات',source:'منابع',researcher:'پژوهشگران',book:'کتابخانه',found:n=>`${n} نتیجه`,none:'نتیجه پژوهشی مطابق پیدا نشد.',ph:'جستجوی عنوان، پژوهشگر، موضوع، منبع…',language:'زبان',date:'تاریخ',topic:'موضوع / دسته',author:'پژوهشگر / نویسنده',sort:'مرتب‌سازی',any:'همه',newest:'جدیدترین',oldest:'قدیمی‌ترین',az:'عنوان الف–ی',za:'عنوان ی–الف',english:'انگلیسی',persian:'فارسی'}};
function text(x){return [x.title,x.title_fa,x.name,x.name_fa,x.author,x.field,x.category,x.source_code,x.institution,x.description,x.node_type].filter(Boolean).join(' ').toLowerCase()}function href(x){return x.kind==='node'?`knowledge-node.html?id=${encodeURIComponent(x.id)}`:x.kind==='article'?(window.HSKRCArticleUrl?window.HSKRCArticleUrl(x):`article.html?id=${encodeURIComponent(x.id)}`):x.kind==='source'?`source.html?id=${encodeURIComponent(x.id)}`:x.kind==='researcher'?`researcher.html?id=${encodeURIComponent(x.id)}`:`book.html?id=${encodeURIComponent(x.id)}`}function titleRaw(x){return L==='fa'&&(x.title_fa||x.name_fa)?(x.title_fa||x.name_fa):(x.title||x.name||'Untitled')}function title(x){return E(titleRaw(x))}function sub(x){if(x.kind==='node')return x.node_type||'Knowledge Node';if(x.kind==='researcher')return x.field||'Researcher';if(x.kind==='source')return [x.source_code,x.author,x.institution,x.publication_year].filter(Boolean).join(' · ');return [x.author,x.category,x.publication_year||x.created_at?.slice?.(0,4)].filter(Boolean).join(' · ')}
function year(x){let y=x.publication_year||x.year;if(y)return Number(y)||0;let d=x.published_at||x.created_at||x.updated_at;return d?Number(String(d).slice(0,4))||0:0}function lang(x){if(x.language)return String(x.language).toLowerCase();if(x.title_fa||x.name_fa)return 'fa';return 'en'}
function tabs(){let a=['all','node','article','source','researcher','book'];document.getElementById('tabs').innerHTML=a.map(k=>`<button class="tab ${filter===k?'active':''}" data-k="${k}">${labels[L][k]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.k;tabs();render()})}
function options(vals){return [...new Set(vals.filter(Boolean).map(v=>String(v).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(v=>`<option value="${E(v)}">${E(v)}</option>`).join('')}
function filters(){let years=[...new Set(all.map(year).filter(Boolean))].sort((a,b)=>b-a);document.getElementById('filters').innerHTML=`<div><label>${labels[L].language}</label><select id="flang"><option value="">${labels[L].any}</option><option value="en">${labels[L].english}</option><option value="fa">${labels[L].persian}</option></select></div><div><label>${labels[L].date}</label><select id="fyear"><option value="">${labels[L].any}</option>${years.map(y=>`<option>${y}</option>`).join('')}</select></div><div><label>${labels[L].topic}</label><select id="ftopic"><option value="">${labels[L].any}</option>${options(all.flatMap(x=>[x.category,x.node_type,x.field]))}</select></div><div><label>${labels[L].author}</label><select id="fauthor"><option value="">${labels[L].any}</option>${options(all.flatMap(x=>[x.author,x.name]))}</select></div><div><label>${labels[L].sort}</label><select id="fsort"><option value="newest">${labels[L].newest}</option><option value="oldest">${labels[L].oldest}</option><option value="az">${labels[L].az}</option><option value="za">${labels[L].za}</option></select></div>`;document.querySelectorAll('#filters select').forEach(el=>el.addEventListener('change',render))}
function render(){let q=document.getElementById('q').value.trim().toLowerCase(),gl=document.getElementById('flang')?.value||'',gy=document.getElementById('fyear')?.value||'',gt=(document.getElementById('ftopic')?.value||'').toLowerCase(),ga=(document.getElementById('fauthor')?.value||'').toLowerCase(),sort=document.getElementById('fsort')?.value||'newest';let r=all.filter(x=>(filter==='all'||x.kind===filter)&&(!q||text(x).includes(q))&&(!gl||lang(x)===gl)&&(!gy||String(year(x))===gy)&&(!gt||[x.category,x.node_type,x.field].filter(Boolean).join(' ').toLowerCase().includes(gt))&&(!ga||[x.author,x.name].filter(Boolean).join(' ').toLowerCase().includes(ga)));r.sort((a,b)=>sort==='oldest'?year(a)-year(b):sort==='az'?titleRaw(a).localeCompare(titleRaw(b)):sort==='za'?titleRaw(b).localeCompare(titleRaw(a)):year(b)-year(a));document.getElementById('count').textContent=labels[L].found(r.length);document.getElementById('results').innerHTML=r.length?r.map(x=>`<a class="card" href="${href(x)}"><div class="type">${E(labels[L][x.kind])}</div><h2>${title(x)}</h2><div class="small">${E(sub(x))}</div></a>`).join(''):`<div class="empty">${labels[L].none}</div>`}
async function load(){
  const sources=[
    {kind:'node',name:'knowledge_nodes',query:()=>db.from('knowledge_nodes').select('*')},
    {kind:'article',name:'articles',query:()=>db.from('articles').select('*').eq('published',true)},
    {kind:'source',name:'research_sources',query:()=>db.from('research_sources').select('*')},
    {kind:'researcher',name:'researchers',query:()=>db.from('researchers').select('*')},
    {kind:'book',name:'books',query:()=>db.from('books').select('*').eq('published',true)}
  ];
  try{
    const rs=await Promise.all(sources.map(async s=>{
      try{
        const r=await s.query();
        if(r.error){
          console.error(`HSKRC Explorer: ${s.name} failed`,r.error);
          return {kind:s.kind,data:[],error:r.error};
        }
        return {kind:s.kind,data:r.data||[],error:null};
      }catch(err){
        console.error(`HSKRC Explorer: ${s.name} exception`,err);
        return {kind:s.kind,data:[],error:err};
      }
    }));
    all=rs.flatMap(r=>r.data.map(x=>({...x,kind:r.kind})));
    const k=['node','article','source','researcher','book'];
    const counts=Object.fromEntries(k.map(z=>[z,all.filter(x=>x.kind===z).length]));
    document.getElementById('stats').innerHTML=k.map(z=>`<div class="stat"><b>${counts[z]}</b><span>${labels[L][z]}</span></div>`).join('');
    tabs();
    filters();
    render();
    const failed=rs.filter(r=>r.error);
    if(failed.length){
      console.warn('HSKRC Explorer loaded with unavailable sources:',failed.map(r=>r.kind));
    }
  }catch(err){
    console.error('HSKRC Explorer failed to load',err);
    document.getElementById('count').textContent=L==='fa'?'خطا در بارگذاری شبکه پژوهشی':'Unable to load research network';
    document.getElementById('results').innerHTML=`<div class="empty">${L==='fa'?'بارگذاری اطلاعات ممکن نشد. لطفاً صفحه را دوباره تازه کنید.':'Research data could not be loaded. Please refresh the page.'}</div>`;
  }
}
document.getElementById('q').placeholder=labels[L].ph;
document.getElementById('q').addEventListener('input',render);
load();
</script></body></html>
