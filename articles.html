<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HSKRC | Articles & Research</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0d1117;
      color: #f5f5f5;
      line-height: 1.7;
    }

    header {
      background: #151a22;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #252c36;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: #42d392;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: #f5f5f5;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #42d392;
    }

    .language-btn {
      background: transparent;
      color: #42d392;
      border: 1px solid #42d392;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .language-btn:hover {
      background: #42d392;
      color: #07110c;
    }

    main {
      min-height: 75vh;
    }

    .page-header {
      text-align: center;
      padding: 70px 20px 40px;
    }

    .page-header h1 {
      color: #42d392;
      font-size: 40px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #9aa2ad;
      font-size: 17px;
    }

    .articles-container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 25px 90px;
    }

    .articles-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(300px, 1fr)
        );
      gap: 25px;
    }

    .article-card {
      background: #151a22;
      border: 1px solid #252c36;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }

    .article-card:hover {
      border-color: #42d392;
      transform: translateY(-3px);
      transition: 0.2s;
    }

    .article-cover {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #0b0f14;
    }

    .article-cover-placeholder {
      width: 100%;
      height: 230px;
      background: #0b0f14;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #42d392;
      font-size: 22px;
      font-weight: bold;
    }

    .article-body {
      padding: 25px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .article-category {
      color: #42d392;
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .article-card h2 {
      font-size: 23px;
      line-height: 1.45;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .article-author {
      color: #8f98a5;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .article-excerpt {
      color: #c7ccd3;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 25px;
      flex: 1;
    }

    .view-button {
      display: block;
      text-align: center;
      background: #42d392;
      color: #07110c;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .view-button:hover {
      opacity: 0.85;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      color: #9aa2ad;
      padding: 60px 20px;
    }

    .error {
      color: #ff8f8f;
    }

    footer {
      background: #080a0d;
      border-top: 1px solid #252c36;
      padding: 35px 20px;
      text-align: center;
      color: #858c96;
    }

    .founder {
      color: #42d392;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .copyright {
      font-size: 14px;
    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav {
        justify-content: center;
        gap: 12px;
      }

      nav a {
        font-size: 14px;
      }

      .page-header h1 {
        font-size: 30px;
      }

      .articles-container {
        padding: 15px 15px 60px;
      }

      .article-cover {
        height: 210px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    HSKRC
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="library.html">
      Library
    </a>

    <a href="articles.html">
      Articles
    </a>

    <a href="index.html#about">
      About
    </a>

    <a
      href="auth.html"
      id="accountLink">
      Login / Register
    </a>

    <button
      class="language-btn"
      onclick="changeLanguage()"
      id="languageButton">
      🌐 Persian
    </button>

  </nav>

</header>



<main>

  <section class="page-header">

    <h1>
      Articles & Research
    </h1>

    <p>
      Research, history, culture and knowledge from HSKRC
    </p>

  </section>


  <section class="articles-container">

    <div
      id="articlesArea"
      class="articles-grid">

      <div class="loading">
        Loading articles...
      </div>

    </div>

  </section>

</main>



<footer>

  <p class="founder">
    Founded by Kamal Barlas
  </p>

  <p class="copyright">
    © 2026 HSKRC - All rights reserved.
  </p>

</footer>



<script>


const SUPABASE_URL =
  "https://uwuklryzxexpofcxrbnm.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



let currentLanguage = "en";



function changeLanguage() {

  currentLanguage =
    currentLanguage === "en"
      ? "fa"
      : "en";

  document.documentElement.lang =
    currentLanguage;

  document.documentElement.dir =
    currentLanguage === "fa"
      ? "rtl"
      : "ltr";

  document.getElementById(
    "languageButton"
  ).textContent =
    currentLanguage === "fa"
      ? "🌐 English"
      : "🌐 Persian";

  loadArticles();

  updateAccountLink();

}



async function updateAccountLink() {

  const accountLink =
    document.getElementById(
      "accountLink"
    );

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    accountLink.href =
      "account.html";

    accountLink.textContent =
      currentLanguage === "fa"
        ? "حساب من 👤"
        : "My Account 👤";

  } else {

    accountLink.href =
      "auth.html";

    accountLink.textContent =
      currentLanguage === "fa"
        ? "ورود / ثبت‌نام"
        : "Login / Register";

  }

}



async function getCoverUrl(
  coverPath
) {

  if (!coverPath) {
    return null;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from("Books")
        .createSignedUrl(
          coverPath,
          3600
        );

    if (error) {

      console.error(
        "Cover error:",
        error
      );

      return null;
    }

    return data?.signedUrl || null;

  } catch (error) {

    console.error(
      "Cover exception:",
      error
    );

    return null;
  }

}



async function loadArticles() {

  const area =
    document.getElementById(
      "articlesArea"
    );


  area.innerHTML = `
    <div class="loading">
      ${
        currentLanguage === "fa"
          ? "در حال بارگذاری مقالات..."
          : "Loading articles..."
      }
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("articles")
      .select(`
        id,
        title,
        author,
        category,
        excerpt,
        cover_path,
        published_at
      `)
      .eq(
        "published",
        true
      )
      .order(
        "published_at",
        {
          ascending: false,
          nullsFirst: false
        }
      );


  if (error) {

    console.error(
      "Articles error:",
      error
    );

    area.innerHTML = `
      <div class="error">
        ${
          currentLanguage === "fa"
            ? "خطا در بارگذاری مقالات."
            : "Unable to load articles."
        }
      </div>
    `;

    return;

  }


  if (!data || data.length === 0) {

    area.innerHTML = `
      <div class="empty">
        ${
          currentLanguage === "fa"
            ? "هنوز مقاله‌ای منتشر نشده است."
            : "No published articles yet."
        }
      </div>
    `;

    return;

  }


  const cards =
    await Promise.all(

      data.map(
        async function(article) {

          const coverUrl =
            await getCoverUrl(
              article.cover_path
            );


          let coverHTML;


          if (coverUrl) {

            coverHTML = `

              <img
                class="article-cover"
                src="${coverUrl}"
                alt="${escapeHTML(
                  article.title
                )}"
              >

            `;

          } else {

            coverHTML = `

              <div
                class="article-cover-placeholder">

                HSKRC

              </div>

            `;

          }


          return `

            <article class="article-card">

              ${coverHTML}


              <div class="article-body">

                <div class="article-category">

                  ${escapeHTML(
                    article.category ||
                    (
                      currentLanguage === "fa"
                        ? "پژوهش"
                        : "Research"
                    )
                  )}

                </div>


                <h2>

                  ${escapeHTML(
                    article.title
                  )}

                </h2>


                <div class="article-author">

                  ${
                    currentLanguage === "fa"
                      ? "نویسنده: "
                      : "Author: "
                  }

                  ${escapeHTML(
                    article.author ||
                    "HSKRC Research Centre"
                  )}

                </div>


                <div class="article-excerpt">

                  ${escapeHTML(
                    article.excerpt ||
                    ""
                  )}

                </div>


                <a
                  class="view-button"
                  href="article.html?id=${encodeURIComponent(
                    article.id
                  )}">

                  ${
                    currentLanguage === "fa"
                      ? "مشاهده مقاله"
                      : "View Article"
                  }

                </a>

              </div>

            </article>

          `;

        }
      )

    );


  area.innerHTML =
    cards.join("");

}



function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



supabaseClient.auth.onAuthStateChange(
  function() {

    updateAccountLink();

  }
);


updateAccountLink();

loadArticles();


</script>


</body>

</html>
