<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Knowledge Node | HSKRC</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="hskrc-global.css" rel="stylesheet"/><script defer="" src="hskrc-global.js"></script><style>:root{--b:#090b0e;--s:#12161b;--g:#c7a15a;--g2:#e2c47f;--t:#f5f2ec;--m:#9ca3ad;--bd:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#c7a15a12,transparent 30%),var(--b);color:var(--t);font:15px/1.7 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{border-bottom:1px solid var(--bd);background:#090b0eee;position:sticky;top:0;z-index:5}.bar,main,.foot{max-width:1180px;margin:auto}.bar{padding:17px 24px;display:flex;align-items:center;gap:22px}.brand{font:700 23px Georgia;color:var(--g2)}nav{display:flex;gap:14px;flex:1;overflow:auto}nav a{white-space:nowrap;color:#c4c4c4;font-size:13px}.active{color:var(--g2)}button{border:1px solid var(--bd);background:transparent;color:#ddd;padding:7px 11px;border-radius:8px}main{padding:42px 24px 80px}.back{color:#aaa}.hero{margin-top:20px;padding:38px;border:1px solid #c7a15a45;border-radius:20px;background:linear-gradient(145deg,#c7a15a10,#12161b)}.kick{color:var(--g2);font:800 12px monospace;text-transform:uppercase}.hero h1{font:700 clamp(34px,5vw,55px)/1.1 Georgia;margin:10px 0}.type,.desc,.intro,.empty{color:var(--m)}.desc{max-width:900px;margin-top:16px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{padding:11px 15px;min-width:130px;border:1px solid var(--bd);border-radius:11px}.stat b{display:block;color:var(--g2);font:700 22px Georgia}.stat span{font-size:11px;color:var(--m)}.profile{display:inline-block;margin-top:20px;padding:9px 13px;border:1px solid #c7a15a55;border-radius:9px;color:var(--g2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.panel{padding:25px;border:1px solid var(--bd);border-radius:16px;background:#12161bf4}.wide{grid-column:1/-1}.panel h2{font:700 24px Georgia;margin:0}.item{display:block;margin-top:10px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:#ffffff04}.item:hover{border-color:#c7a15a66}.item strong{display:block}.small{font-size:12px;color:var(--m)}.path{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:13px;border:1px solid var(--bd);border-radius:10px}.path a{color:var(--g2)}.arrow{color:#69717c}.state{text-align:center;padding:100px;color:var(--m)}footer{border-top:1px solid var(--bd)}.foot{padding:28px 24px;color:var(--m);font-size:12px;display:flex;justify-content:space-between}@media(max-width:760px){.bar{flex-wrap:wrap;padding:13px 16px}nav{order:3;width:100%}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding:25px 20px}main{padding:28px 16px 60px}.foot{flex-direction:column;gap:6px}}</style><link href="https://hskrc.org/knowledge-node.html" rel="canonical"/><meta content="website" property="og:type"/><meta content="HSKRC" property="og:site_name"/><meta content="Knowledge Node | HSKRC" property="og:title"/><meta content="Hassan Sabbah Knowledge &amp; Research Centre" property="og:description"/><meta content="https://hskrc.org/knowledge-node.html" property="og:url"/><meta content="summary" name="twitter:card"/><meta content="Knowledge Node | HSKRC" name="twitter:title"/><meta content="Hassan Sabbah Knowledge &amp; Research Centre" name="twitter:description"/><meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"/>

</head><body><header><div class="bar"><a class="brand" href="index.html">HSKRC</a><nav><a data-en="Home" data-fa="خانه" href="index.html">Home</a><a class="active" data-en="Knowledge Base" data-fa="پایگاه دانش" href="alamut-knowledge-base.html">Knowledge Base</a><a data-en="Library" data-fa="کتابخانه" href="library.html">Library</a><a data-en="Articles" data-fa="مقالات" href="articles.html">Articles</a><a data-en="Researchers" data-fa="پژوهشگران" href="researchers.html">Researchers</a><a data-en="Sources" data-fa="منابع" href="sources.html">Sources</a></nav><button id="lang">فارسی</button></div></header><main><a class="back" data-en="← Knowledge Base" data-fa="→ پایگاه دانش" href="alamut-knowledge-base.html">← Knowledge Base</a><div id="app"><div class="state">Loading knowledge connections…</div></div></main><footer><div class="foot"><span>Founded by Kamal Barlas · Founder & CEO</span><span>© 2026 HSKRC - All rights reserved.</span></div></footer><script>
const db=supabase.createClient('https://uwuklryzxexpofcxrbnm.supabase.co','sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2'),app=document.getElementById('app'),btn=document.getElementById('lang');let L=localStorage.getItem('hskrc_language')==='fa'?'fa':'en';const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const profiles={'hassan-sabbah':'hassan-sabbah.html','alamut':'alamut.html','lambesar':'lambesar.html','navizarshah':'navizarshah.html','shams-kelaye':'shams-kelaye.html','qostinlar':'qostinlar.html','shirkuh':'shirkuh.html','ilan':'ilan.html'};
function tr(){document.documentElement.lang=L;document.documentElement.dir=L==='fa'?'rtl':'ltr';document.querySelectorAll('[data-en][data-fa]').forEach(x=>x.textContent=x.dataset[L]);btn.textContent=L==='fa'?'English':'فارسی';localStorage.setItem('hskrc_language',L)}btn.onclick=()=>{L=L==='en'?'fa':'en';tr();load()};
async function load(){let p=new URLSearchParams(location.search),id=p.get('id'),slug=p.get('slug');if(!id&&!slug){app.innerHTML='<div class="state">Knowledge node identifier not found.</div>';return}let q=db.from('knowledge_nodes').select('*');q=id?q.eq('id',id):q.eq('slug',slug);const {data:n,error}=await q.maybeSingle();if(error||!n){app.innerHTML='<div class="state">Knowledge node not found.</div>';return}document.title=(L==='fa'&&n.title_fa?n.title_fa:n.title)+' | HSKRC';window.HSKRCSEO?.setDynamic({
      title:(L==='fa'&&n.title_fa?n.title_fa:n.title)+" | HSKRC",
      description:n.description||("HSKRC knowledge node: "+(n.title||"Knowledge Node")),
      canonical:"https://hskrc.org/knowledge-node.html?"+(n.slug?"slug="+encodeURIComponent(n.slug):"id="+encodeURIComponent(n.id)),
      entity:{
        "@type":"Thing",
        "name":n.title||"Knowledge Node",
        "alternateName":n.title_fa?[n.title_fa]:undefined,
        "description":n.description||undefined,
        "additionalProperty":n.node_type?{"@type":"PropertyValue","name":"Node type","value":n.node_type}:undefined
      }
    });
const [sl,al,bl]=await Promise.all([db.from('source_node_links').select('source_id').eq('node_id',n.id),db.from('article_node_links').select('article_id').eq('node_id',n.id),db.from('book_node_links').select('book_id').eq('node_id',n.id)]);let sids=[...new Set((sl.data||[]).map(x=>x.source_id).filter(Boolean))],aids=[...new Set((al.data||[]).map(x=>x.article_id).filter(Boolean))],bids=[...new Set((bl.data||[]).map(x=>x.book_id).filter(Boolean))];
const [ss,aa,bb,rsl]=await Promise.all([sids.length?db.from('research_sources').select('*').in('id',sids).order('source_code'):{data:[]},aids.length?db.from('articles').select('id,title,author,category,published').in('id',aids).eq('published',true):{data:[]},bids.length?db.from('books').select('id,title,author,category,published').in('id',bids):{data:[]},sids.length?db.from('researcher_source_links').select('researcher_id,source_id').in('source_id',sids):{data:[]}]);let S=ss.data||[],A=aa.data||[],B=bb.data||[],RL=rsl.data||[],rids=[...new Set(RL.map(x=>x.researcher_id).filter(Boolean))],R=[];if(rids.length){let rr=await db.from('researchers').select('id,slug,name,name_fa,field').in('id',rids);R=rr.data||[]}
const list=(arr,fn,empty)=>arr.length?arr.map(fn).join(''):`<div class="empty">${empty}</div>`;let SI=list(S,s=>`<a class="item" href="source.html?id=${encodeURIComponent(s.id)}"><span class="small">${E(s.source_code||'SOURCE')}</span><strong>${E(s.title)}</strong><span class="small">${E([s.author,s.institution,s.publication_year].filter(Boolean).join(' · '))}</span></a>`,L==='fa'?'منبعی متصل نشده است.':'No connected sources.');let AI=list(A,a=>`<a class="item" href="${window.HSKRCArticleUrl ? window.HSKRCArticleUrl(a) : ("article.html?id="+encodeURIComponent(a.id))}"><strong>${E(a.title)}</strong><span class="small">${E([a.author,a.category].filter(Boolean).join(' · '))}</span></a>`,L==='fa'?'مقاله‌ای متصل نشده است.':'No connected published articles.');let BI=list(B,b=>`<a class="item" href="book.html?id=${encodeURIComponent(b.id)}"><strong>${E(b.title)}</strong><span class="small">${E([b.author,b.category].filter(Boolean).join(' · '))}</span></a>`,L==='fa'?'کتابی متصل نشده است.':'No connected library records.');let RI=list(R,r=>`<a class="item" href="researcher.html?id=${encodeURIComponent(r.id)}"><strong>${E(L==='fa'&&r.name_fa?r.name_fa:r.name)}</strong><span class="small">${E(r.field||'Researcher')}</span></a>`,L==='fa'?'پژوهشگری متصل نشده است.':'No connected researchers.');
let sm=Object.fromEntries(S.map(x=>[x.id,x])),rm=Object.fromEntries(R.map(x=>[x.id,x])),paths=[];for(const x of RL){let s=sm[x.source_id],r=rm[x.researcher_id];if(s&&r)paths.push({s,r})}for(const s of S){let linkedA=A.filter(a=>true);if(!RL.some(x=>x.source_id===s.id)&&linkedA.length)paths.push({s,a:linkedA[0]})}paths=paths.slice(0,30);let PI=paths.length?paths.map(x=>`<div class="path"><strong>${E(L==='fa'&&n.title_fa?n.title_fa:n.title)}</strong><span class="arrow">→</span><a href="source.html?id=${encodeURIComponent(x.s.id)}">${E(x.s.source_code||x.s.title)}</a>${x.a?`<span class="arrow">→</span><a href="${window.HSKRCArticleUrl ? window.HSKRCArticleUrl(x.a) : ("article.html?id="+encodeURIComponent(x.a.id))}">${E(x.a.title)}</a>`:''}${x.r?`<span class="arrow">→</span><a href="researcher.html?id=${encodeURIComponent(x.r.id)}">${E(L==='fa'&&x.r.name_fa?x.r.name_fa:x.r.name)}</a>`:''}</div>`).join(''):`<div class="empty">${L==='fa'?'مسیر شواهد ثبت نشده است.':'No evidence path registered yet.'}</div>`;
let profile=profiles[n.slug]?`<a class="profile" href="${profiles[n.slug]}">${L==='fa'?'باز کردن پروفایل تاریخی ←':'Open historical profile →'}</a>`:'';app.innerHTML=`<section class="hero"><div class="kick">${L==='fa'?'گره دانش HSKRC':'HSKRC Knowledge Node'}</div><h1>${E(L==='fa'&&n.title_fa?n.title_fa:n.title)}</h1><div class="type">${E(n.node_type||'Knowledge Node')}</div>${n.description?`<div class="desc">${E(n.description)}</div>`:''}<div class="stats"><div class="stat"><b>${S.length}</b><span>${L==='fa'?'منبع':'Sources'}</span></div><div class="stat"><b>${A.length}</b><span>${L==='fa'?'مقاله':'Articles'}</span></div><div class="stat"><b>${B.length}</b><span>${L==='fa'?'کتاب':'Library records'}</span></div><div class="stat"><b>${R.length}</b><span>${L==='fa'?'پژوهشگر':'Researchers'}</span></div></div>${profile}</section><div class="grid"><section class="panel"><h2>${L==='fa'?'منابع':'Sources'}</h2><p class="intro">${L==='fa'?'منابع مستند متصل به این موضوع.':'Documented sources connected to this topic.'}</p>${SI}</section><section class="panel"><h2>${L==='fa'?'پژوهشگران':'Researchers'}</h2><p class="intro">${L==='fa'?'پژوهشگران مرتبط از طریق منابع ثبت‌شده.':'Researchers connected through registered sources.'}</p>${RI}</section><section class="panel"><h2>${L==='fa'?'مقالات':'Articles'}</h2>${AI}</section><section class="panel"><h2>${L==='fa'?'کتابخانه':'Library'}</h2>${BI}</section><section class="panel wide"><h2>${L==='fa'?'مسیرهای شواهد':'Evidence Paths'}</h2><p class="intro">${L==='fa'?'مسیرهای قابل پیگیری از گره دانش به منبع و پژوهشگر.':'Traceable paths from this knowledge node to sources and researchers.'}</p>${PI}</section></div>`;tr()}
tr();load();</script></body></html>
