<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unsubscribe | HSKRC</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
:root{font-family:Arial,"Segoe UI",sans-serif;color:#182d40;background:#eef3f7}
*{box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:20px;margin:0;background:radial-gradient(circle at 30% 10%,#dcecf8,transparent 40%),#eef3f7}
main{max-width:520px;width:100%;padding:42px 35px;border-radius:24px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.85);box-shadow:0 24px 68px rgba(35,63,93,.14);backdrop-filter:blur(18px);text-align:center}
small{letter-spacing:.17em;font-weight:700;color:#718597}
h1{font-family:Georgia,serif;font-size:36px}p{line-height:1.8}
button{border:0;background:#243e58;color:white;border-radius:13px;padding:14px 24px;cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:default}
a{display:block;margin-top:24px;color:#285b84}
[dir=rtl] body{font-family:Tahoma,Arial,sans-serif}
@media(max-width:560px){main{padding:30px 20px}}
</style><link rel="stylesheet" href="research-design.css?v=20261028-navigation-unified2">
</head><body class="hskrc-unified">
<main><small>HSKRC · KNOWLEDGE &amp; RESEARCH CENTRE</small>
<h1 id="title">Email notifications</h1>
<p id="message">You can stop receiving email updates about new books and articles. This will not affect your HSKRC account.</p>
<button id="unsubscribe" disabled type="button">Unsubscribe from emails</button>
<p id="status" role="status" aria-live="polite"></p>
<a href="https://hskrc.org/" id="home">Return to HSKRC</a>
</main>
<script>
(function(){
const fa=localStorage.getItem("hskrc_language")==="fa";
if(fa){document.documentElement.lang="fa";document.documentElement.dir="rtl";}
const text=(en,faText)=>fa?faText:en;
const title=document.getElementById("title"),message=document.getElementById("message"),
button=document.getElementById("unsubscribe"),status=document.getElementById("status"),home=document.getElementById("home");
title.textContent=text("Email notifications","اعلان‌های ایمیلی");
message.textContent=text("Stop receiving emails about new HSKRC books and articles. Your account will remain active.","دریافت ایمیل‌های مربوط به کتاب‌ها و مقاله‌های جدید HSKRC را متوقف کنید. حساب شما فعال باقی می‌ماند.");
button.textContent=text("Unsubscribe from emails","لغو دریافت ایمیل‌ها");
home.textContent=text("Return to HSKRC","بازگشت به HSKRC");
const token=new URLSearchParams(location.search).get("token")||"";
if(!/^[a-f0-9-]{36}$/i.test(token)){status.textContent=text("This link is invalid. Please use the link in your email.","این لینک معتبر نیست. از لینک داخل ایمیل استفاده کنید.");return;}
button.disabled=false;
button.addEventListener("click",async()=>{
 button.disabled=true;status.textContent=text("Updating your preferences…","در حال ذخیره تنظیمات…");
 try {
   const response=await fetch("https://uwuklryzxexpofcxrbnm.supabase.co/rest/v1/rpc/hskrc_unsubscribe",{
     method:"POST",
     headers:{"apikey":"sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2","Content-Type":"application/json"},
     body:JSON.stringify({p_token:token})
   });
   if(!response.ok)throw new Error("HTTP "+response.status);
   const ok=await response.json();
   status.textContent=ok?text("You are unsubscribed. You will not receive publication emails.","دریافت ایمیل‌ها لغو شد. دیگر ایمیل اطلاع‌رسانی دریافت نمی‌کنید."):
    text("This link has expired or is invalid.","این لینک نامعتبر است.");
 }catch(e){
   status.textContent=text("Could not unsubscribe. Please try again.","لغو اشتراک انجام نشد، دوباره کوشش کنید.");
   button.disabled=false;
 }
});
})();
</script></body></html>
