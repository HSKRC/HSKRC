<style>:root{--b:#090b0e;--s:#12161b;--g:#c7a15a;--g2:#e2c47f;--t:#f5f2ec;--m:#9ca3ad;--bd:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#c7a15a12,transparent 30%),var(--b);color:var(--t);font:15px/1.7 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}header{border-bottom:1px solid var(--bd);background:#090b0eee;position:sticky;top:0;z-index:5}.bar,main,.foot{max-width:1180px;margin:auto}.bar{padding:17px 24px;display:flex;align-items:center;gap:22px}.brand{font:700 23px Georgia;color:var(--g2)}nav{display:flex;gap:14px;flex:1;overflow:auto}nav a{white-space:nowrap;color:#c4c4c4;font-size:13px}.active{color:var(--g2)}button{border:1px solid var(--bd);background:transparent;color:#ddd;padding:7px 11px;border-radius:8px}main{padding:42px 24px 80px}.back{color:#aaa}.hero{margin-top:20px;padding:38px;border:1px solid #c7a15a45;border-radius:20px;background:linear-gradient(145deg,#c7a15a10,#12161b)}.code{color:var(--g2);font:800 12px monospace}.hero h1{font:700 clamp(34px,5vw,55px)/1.1 Georgia;margin:10px 0}.by{color:var(--g2);font-size:18px}.meta,.notes,.intro,.empty{color:var(--m)}.meta{margin-top:8px}.notes{max-width:900px;margin-top:18px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.stat{padding:11px 15px;min-width:130px;border:1px solid var(--bd);border-radius:11px}.stat b{display:block;color:var(--g2);font:700 22px Georgia}.stat span{font-size:11px;color:var(--m)}.external{display:inline-block;margin-top:20px;padding:9px 13px;border:1px solid #c7a15a55;border-radius:9px;color:var(--g2)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.panel{padding:25px;border:1px solid var(--bd);border-radius:16px;background:#12161bf4}.wide{grid-column:1/-1}.panel h2{font:700 24px Georgia;margin:0}.item{display:block;margin-top:10px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:#ffffff04}.item:hover{border-color:#c7a15a66}.item strong{display:block}.item .small{font-size:12px;color:var(--m)}.path{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:13px;border:1px solid var(--bd);border-radius:10px}.path a{color:var(--g2)}.arrow{color:#69717c}.state{text-align:center;padding:100px;color:var(--m)}footer{border-top:1px solid var(--bd)}.foot{padding:28px 24px;color:var(--m);font-size:12px;display:flex;justify-content:space-between}@media(max-width:760px){.bar{flex-wrap:wrap;padding:13px 16px}nav{order:3;width:100%}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding:25px 20px}main{padding:28px 16px 60px}.foot{flex-direction:column;gap:6px}}</style><link href="https://hskrc.org/source.html" rel="canonical"/><meta content="website" property="og:type"/><meta content="HSKRC" property="og:site_name"/><meta content="Source | HSKRC" property="og:title"/><meta content="Hassan Sabbah Knowledge &amp; Research Centre" property="og:description"/><meta content="https://hskrc.org/source.html" property="og:url"/><meta content="summary" name="twitter:card"/><meta content="Source | HSKRC" name="twitter:title"/><meta content="Hassan Sabbah Knowledge &amp; Research Centre" name="twitter:description"/></head><body>
<header><div class="bar"><a class="brand" href="index.html">HSKRC</a><nav><a data-en="Home" data-fa="خانه" href="index.html">Home</a><a data-en="Knowledge Base" data-fa="پایگاه دانش" href="alamut-knowledge-base.html">Knowledge Base</a><a data-en="Library" data-fa="کتابخانه" href="library.html">Library</a><a data-en="Articles" data-fa="مقالات" href="articles.html">Articles</a><a data-en="Researchers" data-fa="پژوهشگران" href="researchers.html">Researchers</a><a class="active" data-en="Sources" data-fa="منابع" href="sources.html">Sources</a></nav><button id="lang">فارسی</button></div></header>
<main><a class="back" data-en="← Source Registry" data-fa="→ دفتر منابع" href="sources.html">← Source Registry</a><div id="app"><div class="state">Loading source connections…</div></div></main><footer><div class="foot"><span>Founded by Kamaluddin Barlas</span><span>© 2026 HSKRC - All rights reserved.</span></div></footer>
<script>
const db=supabase.createClient("https://uwuklryzxexpofcxrbnm.supabase.co","sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2"),app=document.getElementById('app'),btn=document.getElementById('lang');let L=localStorage.getItem('hskrc_language')==='fa'?'fa':'en';const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function tr(){document.documentElement.lang=L;document.documentElement.dir=L==='fa'?'rtl':'ltr';document.querySelectorAll('[data-en][data-fa]').forEach(x=>x.textContent=x.dataset[L]);btn.textContent=L==='fa'?'English':'فارسی';localStorage.setItem('hskrc_language',L)}btn.onclick=()=>{L=L==='en'?'fa':'en';tr();load()};
function nh(s){return {'hassan-sabbah':'hassan-sabbah.html','alamut':'alamut.html','lambesar':'lambesar.html','navizarshah':'navizarshah.html','shams-kelaye':'shams-kelaye.html','qostinlar':'qostinlar.html','shirkuh':'shirkuh.html','ilan':'ilan.html'}[s]||'alamut-knowledge-base.html'}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='<div class="state">Source identifier not found.</div>';return}const {data:s,error}=await db.from('research_sources').select('*').eq('id',id).maybeSingle();if(error||!s){app.innerHTML='<div class="state">Source not found.</div>';return}document.title=(s.title||'Source')+' | HSKRC';
const [rl,nl,al,bl]=await Promise.all([db.from('researcher_source_links').select('researcher_id').eq('source_id',id),db.from('source_node_links').select('node_id').eq('source_id',id),db.from('article_source_links').select('article_id').eq('source_id',id),db.from('book_source_links').select('book_id').eq('source_id',id)]);const rids=[...new Set((rl.data||[]).map(x=>x.researcher_id))],nids=[...new Set((nl.data||[]).map(x=>x.node_id))],aids=[...new Set((al.data||[]).map(x=>x.article_id))],bids=[...new Set((bl.data||[]).map(x=>x.book_id))];
const [rr,nn,aa,bb]=await Promise.all([rids.length?db.from('researchers').select('id,slug,name,name_fa,field').in('id',rids):{data:[]},nids.length?db.from('knowledge_nodes').select('id,slug,title,node_type').in('id',nids):{data:[]},aids.length?db.from('articles').select('id,title,author,category,published').in('id',aids).eq('published',true):{data:[]},bids.length?db.from('books').select('id,title,author').in('id',bids):{data:[]}]);const R=rr.data||[],N=nn.data||[],A=aa.data||[],B=bb.data||[];
const items=(arr,fn,empty)=>arr.length?arr.map(fn).join(''):`<div class="empty">${empty}</div>`;const RS=items(R,r=>`<a class="item" href="researcher.html?id=${encodeURIComponent(r.id)}"><strong>${E(L==='fa'&&r.name_fa?r.name_fa:r.name)}</strong><span class="small">${E(r.field||'Researcher')}</span></a>`,L==='fa'?'پژوهشگری متصل نشده است.':'No connected researcher.');const NS=items(N,n=>`<a class="item" href="${nh(n.slug)}"><strong>${E(n.title)}</strong><span class="small">${E(n.node_type||'Knowledge Node')}</span></a>`,L==='fa'?'موضوعی متصل نشده است.':'No connected knowledge node.');const AS=items(A,a=>`<a class="item" href="article.html?id=${encodeURIComponent(a.id)}"><strong>${E(a.title)}</strong><span class="small">${E([a.author,a.category].filter(Boolean).join(' · '))}</span></a>`,L==='fa'?'مقاله‌ای متصل نشده است.':'No connected published article.');const BS=items(B,b=>`<a class="item" href="book.html?id=${encodeURIComponent(b.id)}"><strong>${E(b.title)}</strong><span class="small">${E(b.author||'')}</span></a>`,L==='fa'?'کتابی متصل نشده است.':'No connected library book.');
let paths=[];for(const n of N){if(A.length&&R.length)for(const a of A)for(const r of R)paths.push({n,a,r});else if(A.length)for(const a of A)paths.push({n,a});else if(R.length)for(const r of R)paths.push({n,r});else paths.push({n})}if(!paths.length&&A.length&&R.length)for(const a of A)for(const r of R)paths.push({a,r});paths=paths.slice(0,30);const PS=paths.length?paths.map(x=>`<div class="path">${x.n?`<a href="${nh(x.n.slug)}">${E(x.n.title)}</a><span class="arrow">→</span>`:''}<strong>${E(s.source_code||s.title)}</strong>${x.a?`<span class="arrow">→</span><a href="article.html?id=${encodeURIComponent(x.a.id)}">${E(x.a.title)}</a>`:''}${x.r?`<span class="arrow">→</span><a href="researcher.html?id=${encodeURIComponent(x.r.id)}">${E(L==='fa'&&x.r.name_fa?x.r.name_fa:x.r.name)}</a>`:''}</div>`).join(''):`<div class="empty">${L==='fa'?'مسیر شواهد دیگری ثبت نشده است.':'No additional evidence path registered.'}</div>`;
app.innerHTML=`<section class="hero"><div class="code">${E(s.source_code||'HSKRC SOURCE')}</div><h1>${E(s.title)}</h1><div class="by">${E(s.author||s.institution||'Institutional source')}</div><div class="meta">${E([s.source_type,s.institution,s.publication_year,s.language,s.reliability].filter(Boolean).join(' · '))}</div>${s.notes?`<div class="notes">${E(s.notes)}</div>`:''}<div class="stats"><div class="stat"><b>${R.length}</b><span>${L==='fa'?'پژوهشگر':'Researchers'}</span></div><div class="stat"><b>${N.length}</b><span>${L==='fa'?'گره دانشی':'Knowledge nodes'}</span></div><div class="stat"><b>${A.length}</b><span>${L==='fa'?'مقاله':'Articles'}</span></div><div class="stat"><b>${B.length}</b><span>${L==='fa'?'کتاب':'Library books'}</span></div></div>${s.url?`<a class="external" href="${E(s.url)}" target="_blank" rel="noopener">${L==='fa'?'باز کردن منبع اصلی ↗':'Open original source ↗'}</a>`:''}</section><div class="grid"><section class="panel"><h2>${L==='fa'?'پژوهشگران':'Researchers'}</h2><p class="intro">${L==='fa'?'پژوهشگران متصل به این منبع.':'Researchers connected to this source.'}</p>${RS}</section><section class="panel"><h2>${L==='fa'?'دانش مرتبط':'Connected Knowledge'}</h2><p class="intro">${L==='fa'?'موضوعات و گره‌های دانشی مرتبط.':'Related topics and knowledge nodes.'}</p>${NS}</section><section class="panel"><h2>${L==='fa'?'مقالات HSKRC':'HSKRC Articles'}</h2>${AS}</section><section class="panel"><h2>${L==='fa'?'کتابخانه':'Library'}</h2>${BS}</section><section class="panel wide"><h2>${L==='fa'?'مسیرهای شواهد':'Evidence Paths'}</h2><p class="intro">${L==='fa'?'مسیرهای قابل پیگیری میان موضوع، منبع، مقاله و پژوهشگر.':'Traceable paths between knowledge, source, article, and researcher.'}</p>${PS}</section></div>`;tr()}
tr();load();</script></body></html>
