<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSKRC | Researcher Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#090b0e;--s:#12161b;--g:#c7a15a;--g2:#e2c47f;--t:#fff;--m:#9ca3ad;--bd:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(199,161,90,.09),transparent 28%),var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--bd);background:#090b0eee;position:sticky;top:0;z-index:5}.bar{max-width:1180px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:700 24px Georgia,serif}.brand b{color:var(--g)}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}nav a,button{padding:8px 10px;border-radius:8px;font-size:13px}nav a:hover,.active{color:var(--g2);background:#c7a15a12}button{background:transparent;border:1px solid var(--bd);color:#ddd;cursor:pointer}
main{max-width:1180px;margin:auto;padding:45px 24px 80px}.back{color:#bbb;font-size:13px}.hero{margin-top:22px;padding:42px;border:1px solid #c7a15a40;border-radius:20px;background:linear-gradient(145deg,#c7a15a12,#12161bf7 45%)}.kick{color:var(--g);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{font:700 clamp(36px,5vw,58px)/1.08 Georgia,serif;margin:12px 0}.field{color:var(--g2);font-weight:700}.notes{max-width:850px;color:#c9cdd2;margin-top:18px}.notice{border-top:1px solid var(--bd);margin-top:22px;padding-top:16px;color:var(--m);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.panel{padding:26px;border:1px solid var(--bd);border-radius:17px;background:#12161bf5}.wide{grid-column:1/-1}.panel h2{font:700 24px Georgia,serif;margin:0 0 5px}.intro,.meta,.empty{color:var(--m);font-size:12px}.item{display:block;margin-top:10px;padding:15px;border:1px solid var(--bd);border-radius:11px;background:#ffffff04}.item:hover{border-color:#c7a15a66;background:#c7a15a0c}.item strong{display:block;color:#fff}.code{color:var(--g2);font-size:11px;font-weight:800}.state{padding:100px 20px;text-align:center;color:var(--m)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stat{min-width:130px;padding:12px 15px;border:1px solid var(--bd);border-radius:12px;background:#090b0e66}.stat b{display:block;color:var(--g2);font:700 22px Georgia,serif}.stat span{color:var(--m);font-size:11px}.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:13px 15px;border:1px solid var(--bd);border-radius:11px;background:#ffffff04}.path a{color:var(--g2)}.path .arrow{color:#6f7680}.ext{display:inline-block;margin-top:8px;color:var(--g2);font-size:12px}
footer{border-top:1px solid var(--bd)}.foot{max-width:1180px;margin:auto;padding:30px 24px;display:flex;justify-content:space-between;color:var(--m);font-size:12px}.foot strong{color:var(--g)}
@media(max-width:760px){.bar{flex-wrap:wrap;padding:13px 16px}nav{order:3;width:100%;overflow:auto;flex-wrap:nowrap}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.hero{padding:28px 22px}main{padding:30px 16px 60px}.foot{flex-direction:column;gap:7px}}
</style>
<link rel="stylesheet" href="hskrc-global.css">
<script defer src="hskrc-global.js"></script>
</head><body>
<header><div class="bar"><a class="brand" href="index.html">HSKRC <b>Research Archive</b></a><nav>
<a href="index.html" data-en="Home" data-fa="خانه">Home</a><a href="alamut-knowledge-base.html" data-en="Knowledge Base" data-fa="پایگاه دانش">Knowledge Base</a><a href="library.html" data-en="Library" data-fa="کتابخانه">Library</a><a href="articles.html" data-en="Articles" data-fa="مقالات">Articles</a><a class="active" href="researchers.html" data-en="Researchers" data-fa="پژوهشگران">Researchers</a><a href="sources.html" data-en="Sources" data-fa="منابع">Sources</a></nav><button id="lang">فارسی</button></div></header>
<main><a class="back" href="researchers.html" data-en="← Researchers Directory" data-fa="→ فهرست پژوهشگران">← Researchers Directory</a><div id="app"><div class="state">Loading researcher profile…</div></div></main>
<footer><div class="foot"><div data-en="Founded by <strong>Kamal Barlas</strong>" data-fa="بنیان‌گذاری شده توسط <strong>کمال بارلاس</strong>">Founded by <strong>Kamal Barlas</strong></div><div>© 2026 HSKRC - All rights reserved.</div></div></footer>
<script>
const db=supabase.createClient("https://uwuklryzxexpofcxrbnm.supabase.co","sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2"),app=document.getElementById("app"),btn=document.getElementById("lang");
let L=localStorage.getItem("hskrc_language")==="fa"?"fa":"en";
const E=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function tr(){document.documentElement.lang=L;document.documentElement.dir=L==="fa"?"rtl":"ltr";document.querySelectorAll("[data-en][data-fa]").forEach(x=>x.innerHTML=L==="fa"?x.dataset.fa:x.dataset.en);btn.textContent=L==="fa"?"English":"فارسی";localStorage.setItem("hskrc_language",L)}
btn.onclick=()=>{L=L==="en"?"fa":"en";tr();load()}
function nh(s){return {"hassan-sabbah":"hassan-sabbah.html","alamut":"alamut.html","lambesar":"lambesar.html","navizarshah":"navizarshah.html","shams-kelaye":"shams-kelaye.html","qostinlar":"qostinlar.html","shirkuh":"shirkuh.html","ilan":"ilan.html"}[s]||"alamut-knowledge-base.html"}
async function load(){
 let p=new URLSearchParams(location.search),id=p.get("id"),slug=p.get("slug"); if(!id&&!slug){app.innerHTML='<div class="state">Researcher identifier not found.</div>';return}
 let q=db.from("researchers").select("*");q=id?q.eq("id",id):q.eq("slug",slug);let {data:r,error}=await q.maybeSingle();if(error||!r){app.innerHTML='<div class="state">Researcher not found.</div>';return}document.title=(r.name||"Researcher")+" | HSKRC";
 let lr=await db.from("researcher_source_links").select("source_id").eq("researcher_id",r.id),ids=[...new Set((lr.data||[]).map(x=>x.source_id).filter(Boolean))],ss=[],aa=[],nn=[],als=[],nls=[];
 if(ids.length){
   let s=await db.from("research_sources").select("*").in("id",ids).order("source_code");ss=s.data||[];
   let [al,nl]=await Promise.all([db.from("article_source_links").select("article_id,source_id").in("source_id",ids),db.from("source_node_links").select("node_id,source_id").in("source_id",ids)]);als=al.data||[];nls=nl.data||[];
   let ai=[...new Set(als.map(x=>x.article_id).filter(Boolean))],ni=[...new Set(nls.map(x=>x.node_id).filter(Boolean))];
   if(ai.length){let a=await db.from("articles").select("id,title,author,category,published").in("id",ai).eq("published",true);aa=a.data||[]}
   if(ni.length){let n=await db.from("knowledge_nodes").select("id,slug,title,node_type").in("id",ni);nn=n.data||[]}
 }
 const sm=Object.fromEntries(ss.map(x=>[x.id,x])), nm=Object.fromEntries(nn.map(x=>[x.id,x])), am=Object.fromEntries(aa.map(x=>[x.id,x]));
 let S=ss.length?ss.map(s=>`<a class="item" href="sources.html#${E(s.source_code)}"><div class="code">${E(s.source_code)}</div><strong>${E(s.title)}</strong><div class="meta">${E([s.author,s.institution,s.publication_year].filter(Boolean).join(" · "))}</div>${s.url?`<span class="ext">${L==="fa"?"رکورد منبع ↗":"Source record ↗"}</span>`:""}</a>`).join(""):`<div class="empty">${L==="fa"?"منبع مرتبط ثبت نشده است.":"No linked sources registered."}</div>`;
 let N=nn.length?nn.map(n=>`<a class="item" href="${nh(n.slug)}"><strong>${E(n.title)}</strong><div class="meta">${E(n.node_type||"Knowledge Node")}</div></a>`).join(""):`<div class="empty">${L==="fa"?"گره دانشی مرتبط ثبت نشده است.":"No connected knowledge nodes."}</div>`;
 let A=aa.length?aa.map(a=>`<a class="item" href="article.html?id=${encodeURIComponent(a.id)}"><strong>${E(a.title)}</strong><div class="meta">${E([a.author,a.category].filter(Boolean).join(" · "))}</div></a>`).join(""):`<div class="empty">${L==="fa"?"مقاله مرتبط ثبت نشده است.":"No related published articles."}</div>`;
 let paths=[];
 for(const sl of nls){const n=nm[sl.node_id],src=sm[sl.source_id];if(!n||!src)continue;const related=als.filter(x=>x.source_id===sl.source_id).map(x=>am[x.article_id]).filter(Boolean);if(related.length)related.forEach(a=>paths.push({n,src,a}));else paths.push({n,src,a:null})}
 if(!paths.length) for(const src of ss){const related=als.filter(x=>x.source_id===src.id).map(x=>am[x.article_id]).filter(Boolean);related.forEach(a=>paths.push({n:null,src,a}))}
 paths=paths.slice(0,24);
 let P=paths.length?paths.map(x=>`<div class="path">${x.n?`<a href="${nh(x.n.slug)}">${E(x.n.title)}</a><span class="arrow">→</span>`:""}<a href="sources.html#${E(x.src.source_code)}">${E(x.src.source_code)}</a>${x.a?`<span class="arrow">→</span><a href="article.html?id=${encodeURIComponent(x.a.id)}">${E(x.a.title)}</a>`:""}<span class="arrow">→</span><strong>${E(L==="fa"&&r.name_fa?r.name_fa:r.name)}</strong></div>`).join(""):`<div class="empty">${L==="fa"?"مسیر پژوهشی ثبت نشده است.":"No evidence path is registered yet."}</div>`;
 app.innerHTML=`<section class="hero"><div class="kick">${L==="fa"?"پروفایل پژوهشگر":"Researcher Profile"}</div><h1>${E(L==="fa"&&r.name_fa?r.name_fa:r.name)}</h1>${r.field?`<div class="field">${E(r.field)}</div>`:""}${r.notes?`<div class="notes">${E(r.notes)}</div>`:""}<div class="stats"><div class="stat"><b>${ss.length}</b><span>${L==="fa"?"منبع ثبت‌شده":"Registered sources"}</span></div><div class="stat"><b>${nn.length}</b><span>${L==="fa"?"گره دانشی":"Knowledge nodes"}</span></div><div class="stat"><b>${aa.length}</b><span>${L==="fa"?"مقاله مرتبط":"Related articles"}</span></div></div><div class="notice">${L==="fa"?"درج نام پژوهشگر در HSKRC نشان‌دهنده ارتباط پژوهشی آثار او است و به معنی وابستگی، همکاری یا تأیید HSKRC نیست.":"Inclusion in HSKRC indicates research relevance of the scholar's work and does not imply affiliation, collaboration, or endorsement."}</div></section><div class="grid"><section class="panel"><h2>${L==="fa"?"منابع ثبت‌شده":"Registered Sources"}</h2><p class="intro">${L==="fa"?"آثار ثبت‌شده این پژوهشگر در دفتر منابع HSKRC.":"Works by this researcher in the HSKRC Source Registry."}</p>${S}</section><section class="panel"><h2>${L==="fa"?"موضوعات مرتبط":"Connected Knowledge"}</h2><p class="intro">${L==="fa"?"گره‌های دانشی مرتبط از طریق منابع ثبت‌شده.":"Knowledge nodes connected through registered sources."}</p>${N}</section><section class="panel wide"><h2>${L==="fa"?"مقالات مرتبط HSKRC":"Related HSKRC Articles"}</h2><p class="intro">${L==="fa"?"مقالات منتشرشده مرتبط با منابع این پژوهشگر.":"Published HSKRC articles linked through this researcher's sources."}</p>${A}</section><section class="panel wide"><h2>${L==="fa"?"مسیرهای پژوهشی":"Research Evidence Paths"}</h2><p class="intro">${L==="fa"?"نمایش مسیر قابل پیگیری میان موضوع، منبع، مقاله و پژوهشگر.":"Traceable connections between knowledge nodes, registered sources, HSKRC articles, and this researcher."}</p>${P}</section></div>`;tr()
}
tr();load();
</script></body></html>
