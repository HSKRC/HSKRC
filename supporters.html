<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Supporters | HSKRC</title>
<meta name="description" content="Public supporters of the Hassan Sabbah Knowledge & Research Centre.">
<link rel="canonical" href="https://hskrc.org/supporters.html">

<link rel="stylesheet" href="hskrc-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b0b0c;
  --panel:#151413;
  --gold:#c9a45c;
  --text:#f5f2eb;
  --muted:#aaa39a;
  --border:rgba(255,255,255,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px/1.65 Arial,sans-serif;
}

.page{
  width:min(1100px,calc(100% - 32px));
  margin:auto;
  padding:72px 0 90px;
}

.eyebrow{
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

h1{
  margin:10px 0 18px;
  font-size:clamp(38px,7vw,64px);
  line-height:1.05;
}

.lead{
  max-width:760px;
  margin:0;
  color:var(--muted);
  font-size:18px;
}

.summary{
  margin-top:32px;
  padding:20px 22px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
}

.summary-number{
  color:var(--gold);
  font-size:32px;
  font-weight:900;
}

.summary-label{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:24px;
}

.supporter{
  padding:22px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
}

.supporter-name{
  color:var(--gold);
  font-size:18px;
  font-weight:800;
}

.amount{
  margin-top:7px;
  font-size:15px;
  font-weight:700;
}

.method{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.message{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid var(--border);
  color:#d8d3ca;
  white-space:pre-wrap;
}

.date{
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
}

.loading,
.empty,
.error{
  margin-top:25px;
  padding:40px 20px;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  color:var(--muted);
}

.error{
  color:#ff8888;
}

.support-link{
  display:inline-block;
  margin-top:30px;
  padding:11px 17px;
  background:var(--gold);
  color:#17120a;
  border-radius:9px;
  font-weight:800;
  text-decoration:none;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .page{
    padding-top:46px;
  }
}
</style>
</head>

<body>

<main class="page">

<div class="eyebrow">
Community Support
</div>

<h1>
HSKRC Supporters
</h1>

<p class="lead">
We gratefully acknowledge supporters who have chosen to make their support public and whose display has been approved by HSKRC.
</p>

<div class="summary">
  <div
    class="summary-number"
    id="supporterCount"
  >
    0
  </div>

  <div class="summary-label">
    Public supporters
  </div>
</div>

<div id="result">
  <div class="loading">
    Loading approved supporters...
  </div>
</div>

<a
  class="support-link"
  href="support.html"
>
  Support HSKRC
</a>

</main>

<script>

const SUPABASE_URL =
  "https://uwuklryzxexpofcxrbnm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return date.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

async function loadSupporters(){

  const result =
    document.getElementById(
      "result"
    );

  const count =
    document.getElementById(
      "supporterCount"
    );

  const {
    data,
    error
  } =
    await db
      .from("donations")
      .select(
        "id,donor_name,amount,currency,method,message,created_at"
      )
      .eq(
        "is_public",
        true
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(error){

    console.error(
      "Unable to load supporters:",
      error
    );

    result.innerHTML =
      '<div class="error">Unable to load supporters at this time.</div>';

    return;
  }

  const rows =
    data || [];

  count.textContent =
    rows.length;

  if(!rows.length){

    result.innerHTML = `
      <div class="empty">
        No public supporters are currently displayed.
      </div>
    `;

    return;
  }

  result.innerHTML = `

    <div class="grid">

      ${rows.map(row=>`

        <article class="supporter">

          <div class="supporter-name">
            ${escapeHtml(
              row.donor_name ||
              "Anonymous Supporter"
            )}
          </div>

          ${
            row.amount !== null &&
            row.amount !== undefined
              ? `
                <div class="amount">
                  ${escapeHtml(row.amount)}
                  ${escapeHtml(row.currency || "")}
                </div>
              `
              : ""
          }

          ${
            row.method
              ? `
                <div class="method">
                  ${escapeHtml(row.method)}
                </div>
              `
              : ""
          }

          ${
            row.message
              ? `
                <div class="message">
                  ${escapeHtml(row.message)}
                </div>
              `
              : ""
          }

          ${
            row.created_at
              ? `
                <div class="date">
                  ${escapeHtml(
                    formatDate(
                      row.created_at
                    )
                  )}
                </div>
              `
              : ""
          }

        </article>

      `).join("")}

    </div>

  `;
}

loadSupporters();

</script>

<script src="hskrc-global.js"></script>

</body>
</html>
