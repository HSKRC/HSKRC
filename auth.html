<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HSKRC | ورود و ثبت‌نام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0d1117;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #151a22;
      border: 1px solid #29313c;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      color: #42d392;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb6c2;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .language {
      display: block;
      margin: 0 auto 22px;
      background: transparent;
      border: 1px solid #42d392;
      color: #42d392;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #303846;
    }

    .tab {
      width: 50%;
      padding: 12px;
      background: none;
      border: none;
      color: #aeb6c2;
      cursor: pointer;
      font-size: 16px;
    }

    .tab.active {
      color: #42d392;
      border-bottom: 2px solid #42d392;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d8dde5;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303846;
      background: #0d1117;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #42d392;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
      color: #aeb6c2;
      font-size: 13px;
    }

    .checkbox input {
      width: auto;
    }

    .submit {
      width: 100%;
      padding: 14px;
      background: #42d392;
      color: #07110c;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      margin-top: 8px;
    }

    .submit:hover {
      opacity: .9;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #123c2a;
      color: #7ff0b8;
    }

    .error {
      background: #3d1717;
      color: #ff9a9a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #42d392;
      text-decoration: none;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #aeb6c2;
      font-size: 14px;
      cursor: pointer;
    }

    .forgot:hover {
      color: #42d392;
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">HSKRC</div>

  <div class="subtitle">
    Hassan Sabbah Knowledge & Research Centre
  </div>

  <button
    class="language"
    onclick="changeLanguage()"
    id="languageButton">
    🌐 English
  </button>

  <div class="tabs">

    <button
      class="tab active"
      id="registerTab"
      onclick="showRegister()">
      ثبت‌نام
    </button>

    <button
      class="tab"
      id="loginTab"
      onclick="showLogin()">
      ورود
    </button>

  </div>

  <form id="authForm">

    <div id="registerFields">

      <div class="form-group">
        <label id="firstNameLabel">نام</label>
        <input
          type="text"
          id="firstName"
          required>
      </div>

      <div class="form-group">
        <label id="lastNameLabel">نام خانوادگی</label>
        <input
          type="text"
          id="lastName"
          required>
      </div>

      <div class="form-group">
        <label id="phoneLabel">شماره تلفن (اختیاری)</label>
        <input
          type="tel"
          id="phone">
      </div>

    </div>

    <div class="form-group">

      <label id="emailLabel">ایمیل</label>

      <input
        type="email"
        id="email"
        required>

    </div>

    <div class="form-group">

      <label id="passwordLabel">رمز عبور</label>

      <input
        type="password"
        id="password"
        minlength="6"
        required>

    </div>

    <div
      class="checkbox"
      id="consentBox">

      <input
        type="checkbox"
        id="emailConsent">

      <span id="consentText">
        مایل به دریافت ایمیل‌های HSKRC هستم.
      </span>

    </div>

    <button
      type="submit"
      class="submit"
      id="submitButton">

      ایجاد حساب

    </button>

  </form>

  <span
    class="forgot"
    id="forgotButton"
    onclick="forgotPassword()">

    فراموشی رمز عبور

  </span>

  <div
    class="message"
    id="message">
  </div>

  <a
    href="index.html"
    class="back"
    id="backButton">

    ← بازگشت به صفحه اصلی

  </a>

</div>


<script>

/* =====================================================
   HSKRC SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
  "https://uwuklryzxexpofcxrbnm.supabase.co";

const SUPABASE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3dWtscnl6eGV4cG9mY3hyYm5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTE0NzAsImV4cCI6MjEwMzQ4NzQ3MH0.DIdf0mBhkQmo4snY9ti7xZNjyXeEafwfHsVfUWSYphE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   LANGUAGE
   ===================================================== */

let currentLanguage = "fa";

function changeLanguage() {

  currentLanguage =
    currentLanguage === "fa" ? "en" : "fa";

  document.documentElement.lang =
    currentLanguage;

  document.documentElement.dir =
    currentLanguage === "fa" ? "rtl" : "ltr";

  if (currentLanguage === "en") {

    document.querySelector("#registerTab").textContent =
      "Register";

    document.querySelector("#loginTab").textContent =
      "Login";

    document.querySelector("#firstNameLabel").textContent =
      "First Name";

    document.querySelector("#lastNameLabel").textContent =
      "Last Name";

    document.querySelector("#phoneLabel").textContent =
      "Phone (Optional)";

    document.querySelector("#emailLabel").textContent =
      "Email";

    document.querySelector("#passwordLabel").textContent =
      "Password";

    document.querySelector("#consentText").textContent =
      "I agree to receive HSKRC email updates.";

    document.querySelector("#forgotButton").textContent =
      "Forgot Password";

    document.querySelector("#backButton").textContent =
      "← Back to Home";

    document.querySelector("#submitButton").textContent =
      document.querySelector("#loginTab").classList.contains("active")
      ? "Login"
      : "Create Account";

    document.querySelector("#languageButton").textContent =
      "🌐 فارسی";

  } else {

    document.querySelector("#registerTab").textContent =
      "ثبت‌نام";

    document.querySelector("#loginTab").textContent =
      "ورود";

    document.querySelector("#firstNameLabel").textContent =
      "نام";

    document.querySelector("#lastNameLabel").textContent =
      "نام خانوادگی";

    document.querySelector("#phoneLabel").textContent =
      "شماره تلفن (اختیاری)";

    document.querySelector("#emailLabel").textContent =
      "ایمیل";

    document.querySelector("#passwordLabel").textContent =
      "رمز عبور";

    document.querySelector("#consentText").textContent =
      "مایل به دریافت ایمیل‌های HSKRC هستم.";

    document.querySelector("#forgotButton").textContent =
      "فراموشی رمز عبور";

    document.querySelector("#backButton").textContent =
      "← بازگشت به صفحه اصلی";

    document.querySelector("#submitButton").textContent =
      document.querySelector("#loginTab").classList.contains("active")
      ? "ورود"
      : "ایجاد حساب";

    document.querySelector("#languageButton").textContent =
      "🌐 English";
  }
}


/* =====================================================
   REGISTER
   ===================================================== */

function showRegister() {

  document.querySelector("#registerFields").style.display =
    "block";

  document.querySelector("#consentBox").style.display =
    "flex";

  document.querySelector("#registerTab")
    .classList.add("active");

  document.querySelector("#loginTab")
    .classList.remove("active");

  document.querySelector("#submitButton").textContent =
    currentLanguage === "fa"
    ? "ایجاد حساب"
    : "Create Account";
}


/* =====================================================
   LOGIN
   ===================================================== */

function showLogin() {

  document.querySelector("#registerFields").style.display =
    "none";

  document.querySelector("#consentBox").style.display =
    "none";

  document.querySelector("#loginTab")
    .classList.add("active");

  document.querySelector("#registerTab")
    .classList.remove("active");

  document.querySelector("#submitButton").textContent =
    currentLanguage === "fa"
    ? "ورود"
    : "Login";
}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text, type) {

  const message =
    document.querySelector("#message");

  message.style.display = "block";

  message.className =
    "message " + type;

  message.textContent = text;
}


/* =====================================================
   REGISTER / LOGIN
   ===================================================== */

document
  .querySelector("#authForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.querySelector("#email").value.trim();

    const password =
      document.querySelector("#password").value;


    showMessage(
      currentLanguage === "fa"
      ? "لطفاً صبر کنید..."
      : "Please wait...",
      "success"
    );


    /* REGISTER */

    if (
      document.querySelector("#registerTab")
        .classList.contains("active")
    ) {

      const firstName =
        document.querySelector("#firstName")
          .value.trim();

      const lastName =
        document.querySelector("#lastName")
          .value.trim();

      const phone =
        document.querySelector("#phone")
          .value.trim();

      const emailConsent =
        document.querySelector("#emailConsent")
          .checked;


      const { error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              window.location.href,

            data: {

              first_name: firstName,

              last_name: lastName,

              phone: phone,

              email_consent: emailConsent

            }

          }

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        currentLanguage === "fa"
        ? "حساب شما ساخته شد. لطفاً ایمیل خود را برای تأیید حساب بررسی کنید."
        : "Your account has been created. Please check your email to confirm your account.",
        "success"
      );

    }


    /* LOGIN */

    else {

      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        currentLanguage === "fa"
        ? "ورود موفق بود..."
        : "Login successful...",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "index.html";

      }, 1000);

    }

  });


/* =====================================================
   FORGOT PASSWORD
   ===================================================== */

async function forgotPassword() {

  const email =
    document.querySelector("#email").value.trim();

  if (!email) {

    showMessage(
      currentLanguage === "fa"
      ? "ابتدا ایمیل خود را وارد کنید."
      : "Please enter your email first.",
      "error"
    );

    return;
  }


  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.href
      }
    );


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    currentLanguage === "fa"
    ? "لینک تغییر رمز به ایمیل شما ارسال شد."
    : "A password reset link has been sent to your email.",
    "success"
  );
}

</script>

</body>
</html>
