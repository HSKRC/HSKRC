<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HSKRC | Login & Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0d1117;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #151a22;
      border: 1px solid #29313c;
      border-radius: 18px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #42d392;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb6c2;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .language {
      display: block;
      margin: 0 auto 25px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #42d392;
      border-radius: 8px;
      color: #42d392;
      cursor: pointer;
      font-size: 14px;
    }

    .language:hover {
      background: #42d392;
      color: #07110c;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #303846;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 17px;
      cursor: pointer;
    }

    .tab.active {
      color: #42d392;
      border-bottom: 2px solid #42d392;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
    }

    .required {
      color: #ff7777;
      margin-left: 4px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303846;
      background: #0d1117;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #42d392;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
      color: #aaa;
      font-size: 13px;
    }

    .checkbox input {
      width: auto;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #42d392;
      color: #07110c;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #123c2a;
      color: #7ff0b8;
    }

    .error {
      background: #3d1717;
      color: #ff9999;
    }

    .forgot,
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #42d392;
      cursor: pointer;
      text-decoration: none;
    }

    .forgot:hover,
    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">HSKRC</div>

  <div class="subtitle" id="subtitle">
    Hassan Sabbah Knowledge & Research Centre
  </div>

  <button
    class="language"
    onclick="changeLanguage()"
    id="languageButton">
    🌐 Persian
  </button>

  <div class="tabs">

    <button
      type="button"
      class="tab active"
      id="registerTab"
      onclick="showRegister()">
      Register
    </button>

    <button
      type="button"
      class="tab"
      id="loginTab"
      onclick="showLogin()">
      Login
    </button>

  </div>

  <form id="authForm" novalidate>

    <div id="registerFields">

      <div class="form-group">

        <label id="firstNameLabel">
          First Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="firstName"
          autocomplete="given-name">

      </div>

      <div class="form-group">

        <label id="lastNameLabel">
          Last Name <span class="required">*</span>
        </label>

        <input
          type="text"
          id="lastName"
          autocomplete="family-name">

      </div>

      <div class="form-group">

        <label id="phoneLabel">
          Phone (Optional)
        </label>

        <input
          type="tel"
          id="phone"
          autocomplete="tel">

      </div>

    </div>

    <div class="form-group">

      <label id="emailLabel">
        Email <span class="required">*</span>
      </label>

      <input
        type="email"
        id="email"
        autocomplete="email">

    </div>

    <div class="form-group">

      <label id="passwordLabel">
        Password <span class="required">*</span>
      </label>

      <input
        type="password"
        id="password"
        autocomplete="new-password"
        minlength="6">

    </div>

    <div
      class="checkbox"
      id="consentBox">

      <input
        type="checkbox"
        id="emailConsent">

      <span id="consentText">
        I would like to receive HSKRC email updates.
      </span>

    </div>

    <button
      type="submit"
      class="submit"
      id="submitButton">

      Create Account

    </button>

  </form>

  <div
    class="forgot"
    id="forgotButton"
    onclick="forgotPassword()">

    Forgot Password

  </div>

  <div
    class="message"
    id="message">
  </div>

  <a
    href="index.html"
    class="back"
    id="backButton">

    ← Back to Home

  </a>

</div>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
  "https://uwuklryzxexpofcxrbnm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   LANGUAGE
   ========================================= */

let currentLanguage = "en";


function changeLanguage() {

  if (currentLanguage === "en") {

    currentLanguage = "fa";

    document.documentElement.lang = "fa";
    document.documentElement.dir = "rtl";

    document.title =
      "HSKRC | ورود و ثبت‌نام";

    document.getElementById("subtitle").textContent =
      "مرکز دانش و تحقیقات حسن صباح";

    document.getElementById("registerTab").textContent =
      "ثبت‌نام";

    document.getElementById("loginTab").textContent =
      "ورود";

    document.getElementById("firstNameLabel").innerHTML =
      'نام <span class="required">*</span>';

    document.getElementById("lastNameLabel").innerHTML =
      'نام خانوادگی <span class="required">*</span>';

    document.getElementById("phoneLabel").textContent =
      "شماره تلفن (اختیاری)";

    document.getElementById("emailLabel").innerHTML =
      'ایمیل <span class="required">*</span>';

    document.getElementById("passwordLabel").innerHTML =
      'رمز عبور <span class="required">*</span>';

    document.getElementById("consentText").textContent =
      "مایل به دریافت ایمیل‌های HSKRC هستم.";

    document.getElementById("forgotButton").textContent =
      "فراموشی رمز عبور";

    document.getElementById("backButton").textContent =
      "← بازگشت به صفحه اصلی";

    document.getElementById("languageButton").textContent =
      "🌐 English";

  } else {

    currentLanguage = "en";

    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";

    document.title =
      "HSKRC | Login & Register";

    document.getElementById("subtitle").textContent =
      "Hassan Sabbah Knowledge & Research Centre";

    document.getElementById("registerTab").textContent =
      "Register";

    document.getElementById("loginTab").textContent =
      "Login";

    document.getElementById("firstNameLabel").innerHTML =
      'First Name <span class="required">*</span>';

    document.getElementById("lastNameLabel").innerHTML =
      'Last Name <span class="required">*</span>';

    document.getElementById("phoneLabel").textContent =
      "Phone (Optional)";

    document.getElementById("emailLabel").innerHTML =
      'Email <span class="required">*</span>';

    document.getElementById("passwordLabel").innerHTML =
      'Password <span class="required">*</span>';

    document.getElementById("consentText").textContent =
      "I would like to receive HSKRC email updates.";

    document.getElementById("forgotButton").textContent =
      "Forgot Password";

    document.getElementById("backButton").textContent =
      "← Back to Home";

    document.getElementById("languageButton").textContent =
      "🌐 Persian";
  }

  updateButtonText();
}


/* =========================================
   BUTTON TEXT
   ========================================= */

function updateButtonText() {

  const loginActive =
    document.getElementById("loginTab")
      .classList
      .contains("active");

  document.getElementById("submitButton").textContent =
    loginActive
      ? (
          currentLanguage === "fa"
            ? "ورود"
            : "Login"
        )
      : (
          currentLanguage === "fa"
            ? "ایجاد حساب"
            : "Create Account"
        );
}


/* =========================================
   REGISTER
   ========================================= */

function showRegister() {

  document.getElementById("registerFields")
    .style.display = "block";

  document.getElementById("consentBox")
    .style.display = "flex";

  document.getElementById("registerTab")
    .classList.add("active");

  document.getElementById("loginTab")
    .classList.remove("active");

  updateButtonText();

  document.getElementById("message")
    .style.display = "none";
}


/* =========================================
   LOGIN
   ========================================= */

function showLogin() {

  document.getElementById("registerFields")
    .style.display = "none";

  document.getElementById("consentBox")
    .style.display = "none";

  document.getElementById("registerTab")
    .classList.remove("active");

  document.getElementById("loginTab")
    .classList.add("active");

  updateButtonText();

  document.getElementById("message")
    .style.display = "none";
}


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";
}


/* =========================================
   REGISTER VALIDATION
   ========================================= */

function validateRegisterFields() {

  const firstName =
    document.getElementById("firstName")
      .value
      .trim();

  const lastName =
    document.getElementById("lastName")
      .value
      .trim();

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if (!firstName || !lastName) {

    showMessage(
      currentLanguage === "fa"
        ? "لطفاً نام و نام خانوادگی خود را وارد کنید."
        : "Please enter your first and last name.",
      "error"
    );

    return false;
  }


  if (!email) {

    showMessage(
      currentLanguage === "fa"
        ? "لطفاً ایمیل خود را وارد کنید."
        : "Please enter your email.",
      "error"
    );

    return false;
  }


  if (!password) {

    showMessage(
      currentLanguage === "fa"
        ? "لطفاً رمز عبور خود را وارد کنید."
        : "Please enter your password.",
      "error"
    );

    return false;
  }


  if (password.length < 6) {

    showMessage(
      currentLanguage === "fa"
        ? "رمز عبور باید حداقل ۶ کاراکتر باشد."
        : "Password must be at least 6 characters.",
      "error"
    );

    return false;
  }


  return true;
}


/* =========================================
   AUTH FORM
   ========================================= */

document
  .getElementById("authForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document.getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const password =
        document.getElementById("password")
          .value;

      const button =
        document.getElementById("submitButton");


      /* =====================================
         LOGIN
         ===================================== */

      if (
        document.getElementById("loginTab")
          .classList
          .contains("active")
      ) {

        if (!email || !password) {

          showMessage(
            currentLanguage === "fa"
              ? "لطفاً ایمیل و رمز عبور را وارد کنید."
              : "Please enter your email and password.",
            "error"
          );

          return;
        }


        button.disabled = true;

        showMessage(
          currentLanguage === "fa"
            ? "در حال ورود..."
            : "Logging in...",
          "success"
        );


        try {

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            showMessage(
              currentLanguage === "fa"
                ? "ایمیل یا رمز عبور صحیح نیست. اگر رمز را فراموش کرده‌اید، از «فراموشی رمز عبور» استفاده کنید."
                : "Invalid email or password. If you forgot your password, use Forgot Password.",
              "error"
            );

            button.disabled = false;

            return;
          }


          if (data && data.session) {

            showMessage(
              currentLanguage === "fa"
                ? "ورود موفق بود. در حال انتقال..."
                : "Login successful. Redirecting...",
              "success"
            );


            setTimeout(function() {

              window.location.href =
                "index.html";

            }, 800);
          }


        } catch (error) {

          console.error(error);

          showMessage(
            currentLanguage === "fa"
              ? "خطایی هنگام ورود رخ داد."
              : "An error occurred while logging in.",
            "error"
          );

          button.disabled = false;
        }


        return;
      }


      /* =====================================
         REGISTER
         ===================================== */

      if (!validateRegisterFields()) {
        return;
      }


      const firstName =
        document.getElementById("firstName")
          .value
          .trim();

      const lastName =
        document.getElementById("lastName")
          .value
          .trim();

      const phone =
        document.getElementById("phone")
          .value
          .trim();

      const emailConsent =
        document.getElementById("emailConsent")
          .checked;


      button.disabled = true;


      showMessage(
        currentLanguage === "fa"
          ? "در حال ایجاد حساب..."
          : "Creating account...",
        "success"
      );


      try {

        const { data, error } =
          await supabaseClient.auth
            .signUp({

              email: email,

              password: password,

              options: {

                emailRedirectTo:
                  window.location.origin +
                  "/HSKRC/auth.html",

                data: {

                  first_name:
                    firstName,

                  last_name:
                    lastName,

                  phone:
                    phone || null,

                  email_consent:
                    emailConsent

                }

              }

            });


        if (error) {

          const errorText =
            String(error.message || "")
              .toLowerCase();


          if (
            errorText.includes("already registered") ||
            errorText.includes("already exists") ||
            errorText.includes("user already") ||
            errorText.includes("already been registered")
          ) {

            showMessage(
              currentLanguage === "fa"
                ? "این ایمیل قبلاً در HSKRC حساب دارد. لطفاً وارد شوید یا از «فراموشی رمز عبور» استفاده کنید."
                : "This email already has an HSKRC account. Please log in or use Forgot Password.",
              "error"
            );

          } else {

            showMessage(
              currentLanguage === "fa"
                ? "خطا در ایجاد حساب: " + error.message
                : "Error creating account: " + error.message,
              "error"
            );

          }


          button.disabled = false;

          return;
        }


        /*
          اگر Supabase حساب موجود را تشخیص دهد،
          ممکن است به جای error یک user برگرداند.
        */

        if (data && data.user) {

          showMessage(
            currentLanguage === "fa"
              ? "حساب ایجاد شد. لطفاً ایمیل خود را برای تأیید حساب بررسی کنید."
              : "Account created. Please check your email to confirm your account.",
            "success"
          );

        } else {

          showMessage(
            currentLanguage === "fa"
              ? "لطفاً ایمیل خود را برای ادامه بررسی کنید."
              : "Please check your email to continue.",
            "success"
          );
        }


      } catch (error) {

        console.error(error);

        showMessage(
          currentLanguage === "fa"
            ? "خطایی هنگام ایجاد حساب رخ داد."
            : "An error occurred while creating the account.",
          "error"
        );

      }


      button.disabled = false;

    }
  );


/* =========================================
   FORGOT PASSWORD
   ========================================= */

async function forgotPassword() {

  const email =
    document.getElementById("email")
      .value
      .trim()
      .toLowerCase();


  if (!email) {

    showMessage(
      currentLanguage === "fa"
        ? "ابتدا ایمیل خود را وارد کنید."
        : "Please enter your email first.",
      "error"
    );

    return;
  }


  try {

    const { error } =
      await supabaseClient.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              "/HSKRC/auth.html"
          }
        );


    if (error) {

      showMessage(
        currentLanguage === "fa"
          ? "خطا در ارسال لینک بازیابی: " + error.message
          : "Error sending reset link: " + error.message,
        "error"
      );

      return;
    }


    showMessage(
      currentLanguage === "fa"
        ? "اگر این ایمیل دارای حساب باشد، لینک تغییر رمز برای آن ارسال می‌شود. ایمیل خود را بررسی کنید."
        : "If an account exists for this email, a password reset link has been sent. Please check your email.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      currentLanguage === "fa"
        ? "خطایی هنگام ارسال لینک بازیابی رخ داد."
        : "An error occurred while sending the reset link.",
      "error"
    );

  }

}

</script>

</body>
</html>
