<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSKRC | ورود و ثبت‌نام</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #0d1117;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #151a22;
      border: 1px solid #29313c;
      border-radius: 18px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #42d392;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb6c2;
      margin-bottom: 25px;
    }

    .language {
      display: block;
      margin: 0 auto 25px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #42d392;
      border-radius: 8px;
      color: #42d392;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #303846;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 17px;
      cursor: pointer;
    }

    .tab.active {
      color: #42d392;
      border-bottom: 2px solid #42d392;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303846;
      background: #0d1117;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #42d392;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
      color: #aaa;
      font-size: 13px;
    }

    .checkbox input {
      width: auto;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #42d392;
      color: #07110c;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #123c2a;
      color: #7ff0b8;
    }

    .error {
      background: #3d1717;
      color: #ff9999;
    }

    .forgot,
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #42d392;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">HSKRC</div>

    <div class="subtitle">
      Hassan Sabbah Knowledge & Research Centre
    </div>

    <button class="language" onclick="changeLanguage()" id="languageButton">
      🌐 English
    </button>

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        id="registerTab"
        onclick="showRegister()">
        ثبت‌نام
      </button>

      <button
        type="button"
        class="tab"
        id="loginTab"
        onclick="showLogin()">
        ورود
      </button>

    </div>

    <form id="authForm" novalidate>

      <div id="registerFields">

        <div class="form-group">
          <label>نام</label>
          <input type="text" id="firstName">
        </div>

        <div class="form-group">
          <label>نام خانوادگی</label>
          <input type="text" id="lastName">
        </div>

        <div class="form-group">
          <label>شماره تلفن (اختیاری)</label>
          <input type="tel" id="phone">
        </div>

      </div>

      <div class="form-group">

        <label>ایمیل</label>

        <input
          type="email"
          id="email"
          required>

      </div>

      <div class="form-group">

        <label>رمز عبور</label>

        <input
          type="password"
          id="password"
          required
          minlength="6">

      </div>

      <div class="checkbox" id="consentBox">

        <input
          type="checkbox"
          id="emailConsent">

        <span>
          مایل به دریافت ایمیل‌های HSKRC هستم.
        </span>

      </div>

      <button
        type="submit"
        class="submit"
        id="submitButton">

        ایجاد حساب

      </button>

    </form>

    <div
      class="forgot"
      id="forgotButton"
      onclick="forgotPassword()">

      فراموشی رمز عبور

    </div>

    <div
      class="message"
      id="message">
    </div>

    <a
      href="index.html"
      class="back">

      ← بازگشت به صفحه اصلی

    </a>

  </div>


  <script>

    /* =========================================
       SUPABASE
       ========================================= */

    const SUPABASE_URL =
      "https://uwuklryzxexpofcxrbnm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       LANGUAGE
       ========================================= */

    let currentLanguage = "fa";


    function changeLanguage() {

      if (currentLanguage === "fa") {

        currentLanguage = "en";

        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";

        document.getElementById("registerTab").textContent =
          "Register";

        document.getElementById("loginTab").textContent =
          "Login";

        document.getElementById("languageButton").textContent =
          "🌐 فارسی";

        document.getElementById("forgotButton").textContent =
          "Forgot Password";

      } else {

        currentLanguage = "fa";

        document.documentElement.lang = "fa";
        document.documentElement.dir = "rtl";

        document.getElementById("registerTab").textContent =
          "ثبت‌نام";

        document.getElementById("loginTab").textContent =
          "ورود";

        document.getElementById("languageButton").textContent =
          "🌐 English";

        document.getElementById("forgotButton").textContent =
          "فراموشی رمز عبور";
      }
    }


    /* =========================================
       REGISTER
       ========================================= */

    function showRegister() {

      document.getElementById("registerFields").style.display =
        "block";

      document.getElementById("consentBox").style.display =
        "flex";

      document.getElementById("registerTab")
        .classList.add("active");

      document.getElementById("loginTab")
        .classList.remove("active");

      document.getElementById("submitButton").textContent =
        currentLanguage === "fa"
          ? "ایجاد حساب"
          : "Create Account";

      document.getElementById("message").style.display =
        "none";
    }


    /* =========================================
       LOGIN
       ========================================= */

    function showLogin() {

      document.getElementById("registerFields").style.display =
        "none";

      document.getElementById("consentBox").style.display =
        "none";

      document.getElementById("registerTab")
        .classList.remove("active");

      document.getElementById("loginTab")
        .classList.add("active");

      document.getElementById("submitButton").textContent =
        currentLanguage === "fa"
          ? "ورود"
          : "Login";

      document.getElementById("message").style.display =
        "none";
    }


    /* =========================================
       MESSAGE
       ========================================= */

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.textContent = text;

      box.className =
        "message " + type;

      box.style.display = "block";
    }


    /* =========================================
       AUTH FORM
       ========================================= */

    document
      .getElementById("authForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            currentLanguage === "fa"
              ? "ایمیل و رمز عبور را وارد کنید."
              : "Please enter email and password.",
            "error"
          );

          return;
        }


        const button =
          document.getElementById("submitButton");

        button.disabled = true;


        /* ==============================
           LOGIN
           ============================== */

        if (
          document
            .getElementById("loginTab")
            .classList
            .contains("active")
        ) {

          showMessage(
            currentLanguage === "fa"
              ? "در حال ورود..."
              : "Logging in...",
            "success"
          );


          try {

            const { data, error } =
              await supabaseClient.auth
                .signInWithPassword({
                  email: email,
                  password: password
                });


            if (error) {

              showMessage(
                error.message,
                "error"
              );

              button.disabled = false;

              return;
            }


            if (data && data.session) {

              showMessage(
                currentLanguage === "fa"
                  ? "ورود موفق بود. در حال انتقال..."
                  : "Login successful. Redirecting...",
                "success"
              );


              setTimeout(function() {

                window.location.href =
                  "index.html";

              }, 1000);

            }

          } catch (error) {

            showMessage(
              error.message,
              "error"
            );

            button.disabled = false;
          }

          return;
        }


        /* ==============================
           REGISTER
           ============================== */

        const firstName =
          document.getElementById("firstName")
            .value
            .trim();

        const lastName =
          document.getElementById("lastName")
            .value
            .trim();

        const phone =
          document.getElementById("phone")
            .value
            .trim();

        const emailConsent =
          document.getElementById("emailConsent")
            .checked;


        showMessage(
          currentLanguage === "fa"
            ? "در حال ایجاد حساب..."
            : "Creating account...",
          "success"
        );


        try {

          const { data, error } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                emailRedirectTo:
                  window.location.origin +
                  "/HSKRC/auth.html",

                data: {

                  first_name: firstName,

                  last_name: lastName,

                  phone: phone,

                  email_consent: emailConsent

                }

              }

            });


          if (error) {

            showMessage(
              error.message,
              "error"
            );

            button.disabled = false;

            return;
          }


          showMessage(
            currentLanguage === "fa"
              ? "حساب ساخته شد. لطفاً ایمیل خود را باز کنید و لینک تأیید را بزنید."
              : "Account created. Please check your email and confirm your account.",
            "success"
          );

        } catch (error) {

          showMessage(
            error.message,
            "error"
          );
        }


        button.disabled = false;

      });


    /* =========================================
       FORGOT PASSWORD
       ========================================= */

    async function forgotPassword() {

      const email =
        document.getElementById("email")
          .value
          .trim();


      if (!email) {

        showMessage(
          currentLanguage === "fa"
            ? "ابتدا ایمیل خود را وارد کنید."
            : "Please enter your email first.",
          "error"
        );

        return;
      }


      const { error } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                "/HSKRC/auth.html"
            }
          );


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        currentLanguage === "fa"
          ? "لینک تغییر رمز به ایمیل شما ارسال شد."
          : "Password reset email sent.",
        "success"
      );
    }

  </script>

</body>
</html>
