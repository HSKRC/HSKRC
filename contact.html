</head><body><main class="page"><div class="eyebrow">Feedback & Contact</div><h1>Send HSKRC a message</h1><p class="lead">Use this form for corrections, research suggestions, website feedback, or general enquiries. Messages are not displayed publicly.</p><section class="card"><form id="feedbackForm"><div class="grid"><div class="field"><label for="name">Name (optional)</label><input id="name" maxlength="120" autocomplete="name"></div><div class="field"><label for="email">Email (optional)</label><input id="email" type="email" maxlength="200" autocomplete="email"></div><div class="field full"><label for="subject">Subject (optional)</label><input id="subject" maxlength="180"></div><div class="field full"><label for="message">Message</label><textarea id="message" required maxlength="4000"></textarea></div></div><div class="turnstile-wrap"><div class="cf-turnstile" data-sitekey="0x4AAAAAAFFMcan8Fr_48cc1" data-theme="auto"></div></div><button class="btn" id="submitBtn" type="submit">Send feedback</button><div id="status" class="status" role="status"></div><p class="note">Feedback is stored privately and can be reviewed by HSKRC administrators. See the <a href="privacy.html">Privacy Policy</a>.</p></form></section></main><script>const SUPABASE_URL="https://uwuklryzxexpofcxrbnm.supabase.co";const SUPABASE_KEY="sb_publishable_pC4zCrTiZLb0hW0oXqt0tg_i1vjIoW2";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const PUBLIC_FORM_ENDPOINT="https://uwuklryzxexpofcxrbnm.supabase.co/functions/v1/submit-public-form";function status(el,msg,ok=true){el.textContent=msg;el.className="status "+(ok?"ok":"err")}
const form=document.getElementById("feedbackForm"),out=document.getElementById("status"),btn=document.getElementById("submitBtn");form.addEventListener("submit",async e=>{e.preventDefault();const token=form.querySelector('[name="cf-turnstile-response"]')?.value||"";if(!token){status(out,"Please complete the human verification before sending your message.",false);return}btn.disabled=true;try{const {data:sessionData}=await db.auth.getSession();const accessToken=sessionData.session?.access_token||null;const payload={kind:"feedback",turnstileToken:token,name:document.getElementById("name").value.trim()||null,email:document.getElementById("email").value.trim()||null,subject:document.getElementById("subject").value.trim()||null,message:document.getElementById("message").value.trim()};if(!payload.message)throw new Error("Message required");const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY};if(accessToken)headers.Authorization="Bearer "+accessToken;const response=await fetch(PUBLIC_FORM_ENDPOINT,{method:"POST",headers,body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||"Submission failed");form.reset();if(window.turnstile)window.turnstile.reset();status(out,"Thank you. Your feedback was sent successfully.");}catch(err){console.error(err);if(window.turnstile)window.turnstile.reset();status(out,"Message could not be sent. Please complete the verification and try again.",false)}finally{btn.disabled=false}});</script><script src="hskrc-global.js"></script></body></html>
